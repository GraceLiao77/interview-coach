name: CI

on:
  push:
    branches: [main]

# Least privilege: the jobs only need to read the code
permissions:
  contents: read

jobs:
  # Each job runs on its own fresh machine, so each one checks out the code and installs Node.
  client:
    name: Client — lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # npm ci installs exactly what package-lock.json says, and fails if it doesn't match package.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # "build" is tsc -b (which follows the references in tsconfig.json) then vite build,
      # so it typechecks and also proves the bundle builds, which deploying will need
      - name: Typecheck & build
        run: npm run build

  server:
    name: Server — typecheck & mock eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Fake values on purpose: typechecking and the mock eval never call an API.
    # Real keys only belong where real calls happen (the deployed server).
    env:
      JWT_SECRET: ci-not-a-secret
      ANTHROPIC_API_KEY: ci-not-a-key
      GROQ_API_KEY: ci-not-a-key
      MOCK_AI: 'true'
      MOCK_TRANSCRIPTION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      # env.ts calls process.loadEnvFile(), which throws if there is no .env file.
      # The env values above win over the empty ones copied from the example.
      - name: Create .env from the example
        run: cp .env.example .env
      # @prisma/client's types are generated from schema.prisma; this reads the file and needs no database
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Mock eval
        run: npm run eval
